<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">About Me Terminal Panel</title>
  <desc id="desc">Neon terminal style panel for the profile about section.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="45%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffb000" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="304" rx="14" fill="none" stroke="#ffb000" stroke-opacity="0.38"/>
  <rect x="22" y="22" width="1156" height="296" rx="12" fill="none" stroke="#7c3aed" stroke-opacity="0.18"/>

  <circle cx="48" cy="44" r="5" fill="#ff5f56"/>
  <circle cx="66" cy="44" r="5" fill="#ffbd2e"/>
  <circle cx="84" cy="44" r="5" fill="#27c93f"/>

  <text x="600" y="48" text-anchor="middle" fill="#7c7c86" font-family="monospace" font-size="16">maansi@root : ~/system — 120x40</text>
  <text x="606" y="92" text-anchor="middle" fill="#ffb000" font-family="monospace" font-size="34" font-weight="700" filter="url(#glow)">ABOUT // MAANSI</text>
  <rect x="240" y="106" width="720" height="3" fill="url(#amber)" opacity="0.9"/>

  <rect x="70" y="135" width="1060" height="138" rx="12" fill="#0b0b0f" fill-opacity="0.78" stroke="#ffb000" stroke-opacity="0.16"/>
  <text x="112" y="172" fill="#00c2ff" font-family="monospace" font-size="20">$ whoami</text>
  <text x="112" y="198" fill="#e5e7eb" font-family="monospace" font-size="24">Maansi</text>
  <text x="112" y="232" fill="#7c7c86" font-family="monospace" font-size="18">$ cat /etc/profile.d/maansi.conf</text>
  <text x="112" y="256" fill="#c9b389" font-family="monospace" font-size="16">role = Full-Stack Developer  |  focus = polished shipping  |  vibe = dark-mode-first</text>
  <text x="112" y="280" fill="#ff7a00" font-family="monospace" font-size="16">current_load = Meridian Assurance  •  Smart Patient Health Tracker</text>

  <g font-family="monospace" font-size="14" font-weight="700">
    <rect x="832" y="165" width="96" height="26" rx="7" fill="#ffb000"/>
    <text x="880" y="182" text-anchor="middle" fill="#0b0b0e">JAVA 21</text>

    <rect x="936" y="165" width="112" height="26" rx="7" fill="#7c3aed"/>
    <text x="992" y="182" text-anchor="middle" fill="#ffffff">SPRING</text>

    <rect x="832" y="202" width="86" height="26" rx="7" fill="#00c2ff"/>
    <text x="875" y="219" text-anchor="middle" fill="#0b0b0e">REACT</text>

    <rect x="926" y="202" width="114" height="26" rx="7" fill="#22c55e"/>
    <text x="983" y="219" text-anchor="middle" fill="#0b0b0e">ANDROID</text>

    <rect x="834" y="239" width="96" height="26" rx="7" fill="#ff7a00"/>
    <text x="882" y="256" text-anchor="middle" fill="#0b0b0e">AI TRIAGE</text>

    <rect x="938" y="239" width="112" height="26" rx="7" fill="#ef4444"/>
    <text x="994" y="256" text-anchor="middle" fill="#ffffff">HARDENED</text>
  </g>

  <rect x="84" y="290" width="1032" height="2" fill="#ffb000" fill-opacity="0.18"/>
  <rect x="94" y="301" width="250" height="4" rx="2" fill="url(#amber)" opacity="0.8"/>
</svg>
