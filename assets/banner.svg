<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C0A10"/>
      <stop offset="100%" stop-color="#050409"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#FFB000" opacity="0.028"/>
    </pattern>
    <filter id="crtBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#scan)"/>

  <!-- ambient scanning beam -->
  <rect x="0" y="-40" width="1200" height="40" fill="#FFB000" opacity="0.05">
    <animate attributeName="y" values="-40;320;-40" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- window chrome -->
  <rect x="24" y="20" width="1152" height="34" rx="6" fill="#111017" stroke="#3A2E12" stroke-width="1"/>
  <circle cx="46" cy="37" r="5" fill="#7C3AED" opacity="0.8"/>
  <circle cx="64" cy="37" r="5" fill="#FFB000" opacity="0.8"/>
  <circle cx="82" cy="37" r="5" fill="#3DDC84" opacity="0.8"/>
  <text x="600" y="42" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8A6A2A">maansi@root : ~/systems — 128x40</text>

  <rect x="24" y="54" width="1152" height="1" fill="#3A2E12"/>

  <!-- boot sequence lines (static — always visible, no dependency on animation timing) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#FFB000">
    <text x="46" y="90">&gt; ssh maansi@dev.local</text>
    <text x="46" y="116" fill="#C98A2A">[ OK ] full-stack toolchain ......... loaded</text>
    <text x="46" y="140" fill="#C98A2A">[ OK ] spring-boot · react · kotlin .. linked</text>
    <text x="46" y="164" fill="#C98A2A">[ OK ] postgres · mongo · prisma ..... synced</text>
  </g>

  <!-- glitch wordmark -->
  <g font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <text x="48" y="240" font-size="64" fill="#7C3AED" opacity="0.55">
      <animate attributeName="x" values="48;46;50;48" keyTimes="0;0.3;0.6;1" dur="4.5s" repeatCount="indefinite"/>
      MAANSI
    </text>
    <text x="52" y="240" font-size="64" fill="#FF3D6E" opacity="0.4">
      <animate attributeName="x" values="52;55;49;52" keyTimes="0;0.35;0.65;1" dur="3.8s" repeatCount="indefinite"/>
      MAANSI
    </text>
    <text x="50" y="240" font-size="64" fill="url(#amberGlow)" filter="url(#crtBlur)">MAANSI</text>
  </g>

  <text x="52" y="272" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#C98A2A">
    Full-Stack Engineer <tspan fill="#5A4820">//</tspan> web · mobile · backend systems
    <tspan fill="#FFB000">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/></tspan>
  </text>

  <rect x="24" y="290" width="1152" height="1" fill="#3A2E12"/>
  <text x="1176" y="308" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#5A4820">build: stable · uptime: shipping</text>
</svg>
